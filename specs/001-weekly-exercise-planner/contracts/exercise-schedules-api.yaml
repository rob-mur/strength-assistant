openapi: 3.0.3
info:
  title: Exercise Schedules API
  description: API for managing weekly exercise planning schedules
  version: 1.0.0
  
servers:
  - url: https://your-supabase-project.supabase.co/rest/v1
    description: Supabase REST API

paths:
  /exercise_schedules:
    get:
      summary: Get user's exercise schedules
      description: Retrieve all exercise schedules for the authenticated user
      parameters:
        - name: user_id
          in: query
          description: Filter by user ID (auto-applied by RLS)
          schema:
            type: string
            format: uuid
        - name: day_of_week
          in: query
          description: Filter by specific day of week (0-6)
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: select
          in: query
          description: Specify which fields to return
          schema:
            type: string
            default: "*, exercises(*)"
      responses:
        200:
          description: List of exercise schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSchedule'
        401:
          description: Unauthorized
        403:
          description: Forbidden
          
    post:
      summary: Create new exercise schedule
      description: Assign an exercise to a specific day of the week
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseSchedule'
      responses:
        201:
          description: Exercise schedule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSchedule'
        400:
          description: Bad request (validation error)
        401:
          description: Unauthorized
        409:
          description: Conflict (duplicate assignment)

  /exercise_schedules/{id}:
    get:
      summary: Get specific exercise schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Exercise schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSchedule'
        404:
          description: Schedule not found
        401:
          description: Unauthorized
          
    patch:
      summary: Update exercise schedule
      description: Modify order index or other properties of a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseSchedule'
      responses:
        200:
          description: Exercise schedule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSchedule'
        400:
          description: Bad request
        401:
          description: Unauthorized
        404:
          description: Schedule not found
          
    delete:
      summary: Delete exercise schedule
      description: Remove an exercise assignment from a day
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Exercise schedule deleted successfully
        401:
          description: Unauthorized
        404:
          description: Schedule not found

  /rpc/get_weekly_plan:
    post:
      summary: Get computed weekly plan
      description: Retrieve organized weekly plan with exercises grouped by day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id_param:
                  type: string
                  format: uuid
                  description: User ID to get plan for
      responses:
        200:
          description: Weekly plan with exercises organized by day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlan'
        401:
          description: Unauthorized

components:
  schemas:
    ExerciseSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the schedule entry
        user_id:
          type: string
          format: uuid
          description: ID of the user who owns this schedule
        exercise_id:
          type: string
          format: uuid
          description: ID of the assigned exercise
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of week (0=Sunday, 1=Monday, ..., 6=Saturday)
        order_index:
          type: integer
          minimum: 0
          description: Order of exercise within the day
        created_at:
          type: string
          format: date-time
          description: When the schedule was created
        updated_at:
          type: string
          format: date-time
          description: When the schedule was last updated
        exercises:
          $ref: '#/components/schemas/Exercise'
      required:
        - id
        - user_id
        - exercise_id
        - day_of_week
        - order_index
        - created_at
        - updated_at

    CreateExerciseSchedule:
      type: object
      properties:
        exercise_id:
          type: string
          format: uuid
          description: ID of the exercise to assign
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of week to assign exercise to
        order_index:
          type: integer
          minimum: 0
          default: 0
          description: Order within the day (optional)
      required:
        - exercise_id
        - day_of_week

    UpdateExerciseSchedule:
      type: object
      properties:
        order_index:
          type: integer
          minimum: 0
          description: New order within the day
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Move to different day
      additionalProperties: false

    Exercise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of the exercise
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    WeeklyPlan:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayPlan'
          minItems: 7
          maxItems: 7

    DayPlan:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        exercises:
          type: array
          items:
            type: object
            properties:
              schedule_id:
                type: string
                format: uuid
              exercise_id:
                type: string
                format: uuid
              exercise_name:
                type: string
              order_index:
                type: integer
        has_exercises:
          type: boolean

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Supabase JWT token

security:
  - BearerAuth: []