openapi: 3.0.0
info:
  title: Workout Sets API
  version: 1.0.0
  description: API contracts for workout set logging functionality

paths:
  /api/workout-sets:
    post:
      summary: Create a new workout set
      operationId: createWorkoutSet
      tags: [WorkoutSets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutSetRequest'
      responses:
        '201':
          description: Workout set created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSet'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
        '500':
          description: Server error

    get:
      summary: Get workout sets for current user
      operationId: getWorkoutSets
      tags: [WorkoutSets]
      parameters:
        - name: session_date
          in: query
          description: Filter by session date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: exercise_id
          in: query
          description: Filter by exercise ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of workout sets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkoutSet'
                  meta:
                    $ref: '#/components/schemas/ListMeta'

  /api/workout-sets/{id}:
    put:
      summary: Update a workout set
      operationId: updateWorkoutSet
      tags: [WorkoutSets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkoutSetRequest'
      responses:
        '200':
          description: Workout set updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSet'
        '400':
          description: Validation error
        '404':
          description: Workout set not found
        '401':
          description: Unauthorized

    delete:
      summary: Delete a workout set
      operationId: deleteWorkoutSet
      tags: [WorkoutSets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Workout set deleted successfully
        '404':
          description: Workout set not found
        '401':
          description: Unauthorized

components:
  schemas:
    WorkoutSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        exercise_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_date:
          type: string
          format: date
        weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 2000
        repetitions:
          type: integer
          minimum: 1
          maximum: 100
        rpe:
          type: number
          format: float
          minimum: 1.0
          maximum: 10.0
          multipleOf: 0.5
        set_order:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - exercise_id
        - user_id
        - session_date
        - weight
        - repetitions
        - rpe
        - set_order
        - created_at
        - updated_at

    CreateWorkoutSetRequest:
      type: object
      properties:
        exercise_id:
          type: string
          format: uuid
        weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 2000
        repetitions:
          type: integer
          minimum: 1
          maximum: 100
        rpe:
          type: number
          format: float
          minimum: 1.0
          maximum: 10.0
          multipleOf: 0.5
        session_date:
          type: string
          format: date
      required:
        - exercise_id
        - weight
        - repetitions
        - rpe
        - session_date

    UpdateWorkoutSetRequest:
      type: object
      properties:
        weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 2000
        repetitions:
          type: integer
          minimum: 1
          maximum: 100
        rpe:
          type: number
          format: float
          minimum: 1.0
          maximum: 10.0
          multipleOf: 0.5
      # All fields optional for updates

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              value:
                type: string

    ListMeta:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer